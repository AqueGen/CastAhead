name: tests

on: [push, pull_request]

# The suites are plain Lua 5.1 scripts, not busted specs: test.lua validates the
# shipped data end to end, test_core.lua replays event sequences against a
# stubbed WoW API. Both print OK and exit non-zero on any failure.
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - name: Syntax-check every shipped file
        run: luac -p Config.lua Data.lua Priority.lua Traits.lua Debuffs.lua Match.lua DebuffCalls.lua Timeline.lua Core.lua Recorder.lua UI.lua Options.lua Minimap.lua ReportWindow.lua
      - name: Data and matcher suite
        run: lua test.lua
      - name: Runtime suite against the stubbed API
        run: lua test_core.lua
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Generator and audit tools
        run: python -m pytest -q tools
