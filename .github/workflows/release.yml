name: Package and Release

# Stable releases: release-please.yml dispatches this workflow on the tag it
# creates when the release PR merges. Run it by hand for a beta: it builds the
# open release PR's branch, so the TOC version and the top CHANGELOG section
# already describe the coming release. It must NOT trigger on tag pushes, or it
# would race the packaging job in release-please.yml.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no tag, no upload)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || 'release-please--branches--main' }}
          fetch-depth: 0

      # Skipped when dispatched on a tag: release-please.yml dispatches this
      # workflow on the tag it just created, and that tag must not be recreated.
      - name: Determine beta version
        id: version
        if: github.ref_type != 'tag'
        run: |
          BASE=$(jq -r '."."' .release-please-manifest.json)
          if git rev-parse -q --verify "refs/tags/v${BASE}" >/dev/null; then
            echo "::error::v${BASE} is already released - no open release PR to build a beta from"
            exit 1
          fi
          LAST=$(git tag -l "v${BASE}-beta.*" | sed 's/.*-beta\.//' | sort -n | tail -1)
          VERSION="${BASE}-beta.$(( ${LAST:-0} + 1 ))"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # A dry run must leave nothing behind, so it does not tag either.
      - name: Create beta tag
        if: github.ref_type != 'tag' && !inputs.dry_run
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Beta v${VERSION}"
          git push origin "v${VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release notes for this version
        run: |
          awk '/^## \[/ { if (seen) exit; seen = 1 } seen' CHANGELOG.md > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Package and Release
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ inputs.dry_run && '-d' || '' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
